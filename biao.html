<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>621 胡家瑜</title>
</head>
<body>
    <h2>表单form</h2>
    <form action="http://www.huanqiu.com" name="y1">
       <p>用户名：<input type="text" name="username" placeholder="请输入用户名"></p>
       <p>密码：<input type="password" name="password" placeholder="请输入密码"></p>
       <p>性别：
       <input type="radio" name="gender" value="male">男
       <input type="radio" name="gender" value="female">女
       <input type="radio" name="gender" value="secret">保密</p>
       <p>爱好：
       <input type="checkbox" name="hobby" value="sports">运动
       <input type="checkbox" name="hobby" value="music">音乐
       <input type="checkbox" name="hobby" value="reading">玩慢慢
       <input type="checkbox" name="hobby" value="reading">阅读</p>
       <p>籍贯：
       <select name="native" id="">
           <option value="beijing">北京</option>
           <option value="shanghai">上海</option>
           <option value="guangdong" selected>广东</option>
           <option value="shenzhen">深圳</option>
       </select></p>
       <p>个人介绍：<textarea name="introduction" id="" cols="30" rows="10" placeholder="请输入个人介绍"></textarea></p>
       <p>出生日期：<input type="date" name="birthday" id=""></p>
       <p>上传文件：<input type="file" name="file" id=""></p>
       <p><input type="submit" value="提交"></p>
       <p><input type="reset" value="重置表单"></p>
    </form>
</body>
</html>
