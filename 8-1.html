<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            /* 水平垂直居中 */
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.5s;
            box-sizing: border-box;
            /*width包含内边距和边框宽度*/
            color: #333;
        }
        .box:first-child:hover{
            background: red;
            color: white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
        }
        .box:nth-child(4):hover{
            text-shadow: 10px 10px 10px #ccc;
                   }
        .box:nth-of-type(5):hover{
            background:linear-gradient(45deg,blue,white);
        }
        .box:nth-of-type(6):hover{
            background:radial-gradient(#fff,#ccc,#000);
        }
        .box:nth-of-type(7):hover{
            transform: scale(0.5);
        }
        .box:nth-child(8):hover{
            transform: translate(-100px);
        }
        .box:nth-child(9):hover{
            transform: rotate(-180deg);
        }
        .box:nth-child(10):hover{
            transform: skew(20deg) translate(50px);
        }
        .box:nth-last-child(2):hover:before{
            /*内部的最前面的元素*/
            content: '*';
            color: red;
        }
        .box:nth-last-child(1):hover::after{
            content: '胡家瑜';
            display: inline-flex;
            background-color: rgb(190, 151, 245);
            color: white;
            padding: 10px;
            font-size: 16px;
            justify-content: center;
            align-items: center;
        }
        .box:nth-child(3n):hover{
            border: 3px solid red;
        }
        </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
