<!DOCTYPE html>
<!-- 姓名：胡家瑜 日期：2026-10-29 功能：按参考图还原网易云音乐顶部导航栏（一级导航 + 红色二级导航 + 搜索框） -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐 · 顶部导航栏还原</title>
    <link rel="stylesheet" href="./font/font_5244836_gsc19f4yjzd/iconfont.css">
    <style>
        /* 姓名：胡家瑜 日期：2026-10-29 功能：导航栏样式（所有类名以 hjy_ 开头） */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; }
        ul { list-style: none; }

        /* ===== 顶部一级导航 ===== */
        .hjy_topbar {
            width: 100%;
            height: 70px;
            background: #242424;
            border-bottom: 1px solid #1a1a1a;
        }
        .hjy_inner {
            max-width: 1200px;
            height: 100%;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
        }

        /* 品牌区 */
        .hjy_brand_box {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 10px;
        }
        .hjy_logo_svg {
            width: 46px;
            height: 46px;
            display: block;
        }
        .hjy_brand {
            margin-left: 10px;
            font-size: 24px;
            font-weight: 700;
            color: #f2f2f2;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* 一级导航项 */
        .hjy_nav {
            display: flex;
            align-items: stretch;
            height: 70px;
            margin-left: 8px;
        }
        .hjy_nav_item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-size: 14px;
            color: #cccccc;
            height: 70px;
            white-space: nowrap;
            transition: color 0.2s ease, background-color 0.2s ease;
        }
        .hjy_nav_item:hover {
            color: #ffffff;
            background: #000000;
        }
        .hjy_nav_item.hjy_active {
            color: #ffffff;
            background: #000000;
        }
        /* 当前项下方的红色小三角 */
        .hjy_caret {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid #c20c0c;
        }
        .hjy_nav_item.hjy_active .hjy_caret { display: block; }

        /* 右侧：搜索 + 创作者中心 */
        .hjy_right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .hjy_search {
            display: flex;
            align-items: center;
            width: 205px;
            height: 34px;
            padding: 0 14px;
            border-radius: 17px;
            background: #3d3d3d;
            border: 1px solid #3d3d3d;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .hjy_search:hover { background: #454545; border-color: #4d4d4d; }
        .hjy_search.hjy_focus { background: #4a4a4a; border-color: #5a5a5a; }
        .hjy_search_icon {
            font-size: 14px;
            color: #b3b3b3;
            margin-right: 8px;
            line-height: 1;
        }
        .hjy_search_input {
            flex: 1;
            min-width: 0;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font-size: 12px;
            font-family: inherit;
        }
        .hjy_search_input::placeholder { color: #b3b3b3; }
        .hjy_creator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            padding: 0 16px;
            border-radius: 17px;
            border: 1px solid #5a5a5a;
            color: #cccccc;
            font-size: 12px;
            white-space: nowrap;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .hjy_creator:hover { color: #ffffff; border-color: #8c8c8c; }

        /* ===== 红色二级导航 ===== */
        .hjy_subbar {
            width: 100%;
            height: 35px;
            background: #c20c0c;
            border-bottom: 1px solid #a40011;
        }
        .hjy_sub_inner {
            justify-content: center;
            gap: 14px;
            padding: 0 30px;
        }
        .hjy_sub_item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            padding: 0 16px;
            border-radius: 14px;
            font-size: 13px;
            color: #ffffff;
            opacity: 0.92;
            white-space: nowrap;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }
        .hjy_sub_item:hover {
            background: #a20909;
            opacity: 1;
        }
        .hjy_sub_item.hjy_sub_active {
            background: #9b0909;
            opacity: 1;
            font-weight: 700;
        }

        /* ===== 内容占位（参考图未包含的部分） ===== */
        .hjy_placeholder {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 30px;
        }
        .hjy_placeholder p {
            font-size: 13px;
            color: #c4c4c4;
            text-align: center;
            letter-spacing: 1px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1080px) {
            .hjy_search { width: 170px; }
            .hjy_nav_item { padding: 0 13px; }
        }
        @media (max-width: 900px) {
            .hjy_brand { font-size: 20px; }
            .hjy_nav_item.hjy_nav_extra { display: none; }
            .hjy_search { width: 140px; }
        }
        @media (max-width: 700px) {
            .hjy_inner { padding: 0 14px; }
            .hjy_logo_svg { width: 38px; height: 38px; }
            .hjy_brand { font-size: 17px; margin-left: 8px; }
            .hjy_nav_item { padding: 0 10px; font-size: 13px; }
            .hjy_creator { display: none; }
            .hjy_search { width: 120px; }
            .hjy_sub_inner { justify-content: flex-start; overflow-x: auto; gap: 4px; }
            .hjy_sub_item { padding: 0 11px; }
        }
    </style>
</head>
<body>

    <!-- ===== 一级导航 ===== -->
    <header class="hjy_topbar">
        <div class="hjy_inner">
            <a class="hjy_brand_box" href="#" title="网易云音乐">
                <svg class="hjy_logo_svg" viewBox="0 0 48 48" aria-hidden="true">
                    <circle cx="24" cy="24" r="23" fill="#d6323b"></circle>
                    <circle cx="24" cy="24" r="14" fill="none" stroke="#ffffff" stroke-width="2.6"></circle>
                    <circle cx="20.2" cy="27.6" r="3.9" fill="#ffffff"></circle>
                    <path d="M24 27.6V13.6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"></path>
                    <path d="M24 15.4c3.4-1.6 6.8-0.4 8.1 2.4" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"></path>
                </svg>
                <span class="hjy_brand">网易云音乐</span>
            </a>

            <nav class="hjy_nav">
                <a href="#" class="hjy_nav_item hjy_active" data-hjy-nav>发现音乐<span class="hjy_caret"></span></a>
                <a href="#" class="hjy_nav_item" data-hjy-nav>我的音乐</a>
                <a href="#" class="hjy_nav_item" data-hjy-nav>关注</a>
                <a href="#" class="hjy_nav_item" data-hjy-nav>商城</a>
                <a href="#" class="hjy_nav_item hjy_nav_extra" data-hjy-nav>音乐人</a>
                <a href="#" class="hjy_nav_item hjy_nav_extra" data-hjy-nav>云推歌</a>
                <a href="#" class="hjy_nav_item hjy_nav_extra" data-hjy-nav>下载客户端</a>
            </nav>

            <div class="hjy_right">
                <div class="hjy_search" id="hjy_search_box">
                    <i class="iconfont icon-sousuo hjy_search_icon"></i>
                    <input type="text" class="hjy_search_input" id="hjy_search_input" placeholder="音乐/视频/电台/用户">
                </div>
                <a href="#" class="hjy_creator">创作者中心</a>
            </div>
        </div>
    </header>

    <!-- ===== 二级导航 ===== -->
    <nav class="hjy_subbar">
        <div class="hjy_inner hjy_sub_inner">
            <a href="#" class="hjy_sub_item hjy_sub_active" data-hjy-sub>推荐</a>
            <a href="#" class="hjy_sub_item" data-hjy-sub>排行榜</a>
            <a href="#" class="hjy_sub_item" data-hjy-sub>歌单</a>
            <a href="#" class="hjy_sub_item" data-hjy-sub>播客</a>
            <a href="#" class="hjy_sub_item" data-hjy-sub>歌手</a>
            <a href="#" class="hjy_sub_item" data-hjy-sub>新碟上架</a>
        </div>
    </nav>

    <main class="hjy_placeholder">
        <p>↑ 网易云音乐顶部导航（当前：发现音乐 / 推荐）</p>
    </main>

    <script>
        /* 姓名：胡家瑜 日期：2026-10-29 功能：导航项切换高亮、搜索框聚焦状态，变量以 hjy_ 开头 */
        (function () {
            /* 一级导航：点击切换黑色底块与红色小三角 */
            var hjy_nav_items = document.querySelectorAll('[data-hjy-nav]');
            for (var hjy_i = 0; hjy_i < hjy_nav_items.length; hjy_i++) {
                hjy_nav_items[hjy_i].addEventListener('click', function (hjy_e) {
                    hjy_e.preventDefault();
                    for (var hjy_j = 0; hjy_j < hjy_nav_items.length; hjy_j++) {
                        hjy_nav_items[hjy_j].classList.remove('hjy_active');
                    }
                    this.classList.add('hjy_active');
                    if (!this.querySelector('.hjy_caret')) {
                        var hjy_span = document.createElement('span');
                        hjy_span.className = 'hjy_caret';
                        this.appendChild(hjy_span);
                    }
                });
            }

            /* 二级导航：点击切换深红色圆角块 */
            var hjy_sub_items = document.querySelectorAll('[data-hjy-sub]');
            for (var hjy_k = 0; hjy_k < hjy_sub_items.length; hjy_k++) {
                hjy_sub_items[hjy_k].addEventListener('click', function (hjy_e) {
                    hjy_e.preventDefault();
                    for (var hjy_j = 0; hjy_j < hjy_sub_items.length; hjy_j++) {
                        hjy_sub_items[hjy_j].classList.remove('hjy_sub_active');
                    }
                    this.classList.add('hjy_sub_active');
                });
            }

            /* 搜索框聚焦时背景变亮 */
            var hjy_search_box = document.getElementById('hjy_search_box');
            var hjy_search_input = document.getElementById('hjy_search_input');
            hjy_search_input.addEventListener('focus', function () {
                hjy_search_box.classList.add('hjy_focus');
            });
            hjy_search_input.addEventListener('blur', function () {
                hjy_search_box.classList.remove('hjy_focus');
            });
        })();
    </script>
</body>
</html>
