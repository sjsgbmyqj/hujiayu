<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型，框模型，box model</title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        /*尽量少用通配符*/
        ul{
            list-style: none;
        }
        .a{
            width: 500px;
            height: 500px;
            border: 2px dotted red;
            padding: 70px 60px 50px 40px;/*上 下 左 右*/
            margin: 40px auto;
            /*上下 左右，左右margin为auto时，盒子居中*/
        }
        /*盒子的高度：内容高度+上下边框的高度+上下padding的高度+上下margin的高度*/
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed #039;
            margin: 50px auto 40px;
            
        }
        .c{
            width: 200px;
            height: 200px;
            border: 2px solid pink;
            margin: 20px auto;

        }
    </style>
</head>
<body>
    <div class="a">621 胡家瑜</div>
    <div class="b">621 胡家瑜</div>
    <div class="c">621 胡家瑜</div>
</body>
</html>
