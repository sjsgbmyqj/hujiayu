<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        } /*群组选择器*/
        #box{
            padding: 8px;
            margin: 20px;
            border: 1px solid #ccc;
            font-size: 12px;
            width: 480px;
        }
        h2{
            color: white;
            background-color: black;
        }
        #box h3{
            font-size: 16px;
            /*行高*/
            line-height: 33px;
            /*文字居中*/
            text-align: center;
            color: #034;
            letter-spacing: 3px;
        }
        #box p{
            color: #666;
            text-indent: 2em;
            line-height: 150%;
        }
        #box p a{
            color: #c00;
            /*下划线*/
            text-decoration: none;
        }
        .name,.class,.stuId{
            /*加粗*/
            font-weight: bold;
            color: blue;
        }
        .knowledge{
            color: white;
            background-color: blue;
        }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p>学号：<span class="stuId">621</span>，姓名：<span class="name">胡家瑜</span>，班级：<span class="class">计算机24006</span>，《《高级网页设计》的学习难度是：一般，
            本实例的知识点：<span class="knowledge">CSS 群组选择器和后代选择器</span>。
            <a href="#">【更多】</a><--点击跳转</a>
        </p>
    </div>
    
</body>
</html>
